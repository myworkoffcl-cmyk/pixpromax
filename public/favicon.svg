<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #252540; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f7f8ff; }
      }
    </style>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c62ff;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#166fca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10a879;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect class="bg" width="256" height="256" rx="64"/>
  <!-- Logo square with gradient -->
  <rect x="48" y="48" width="160" height="160" rx="32" fill="url(#grad1)"/>
  <!-- Lime yellow star/accent in center -->
  <circle cx="128" cy="128" r="20" fill="#ddf190"/>
</svg>