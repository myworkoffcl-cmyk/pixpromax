<!DOCTYPE html>

<html>

<head>

<title>WebP to JPG Converter | PixProMax</title>

<meta name="description" content="Convert WebP images to JPG online free using PixProMax.">

<link rel="stylesheet" href="../css/styles.css">

</head>

<body>

<h1>WebP to JPG Converter</h1>

<p>Upload a WebP image to convert it into JPG format.</p>

<input type="file" id="fileInput">

<br><br>

<button id="convertBtn">Convert to JPG</button>

<script type="module">

import { processImage } from "../js/converter.js"
import { downloadFile } from "../js/utils.js"

document.getElementById("convertBtn").onclick = async () => {

const file = document.getElementById("fileInput").files[0]

if(!file){
alert("Please upload a WebP image")
return
}

const blob = await processImage(file,{
mode:"convert",
format:"image/jpeg"
})

downloadFile(blob,"converted-image.jpg")

}

</script>

</body>

</html>
