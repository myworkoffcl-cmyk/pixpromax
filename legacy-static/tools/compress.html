<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compress Image - PixProMax</title>

<style>

body{
font-family:Arial, Helvetica, sans-serif;
margin:0;
background:#f5f5f5;
}

.header{
padding:20px;
background:white;
border-bottom:1px solid #ddd;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.tool-container{
display:flex;
gap:30px;
}

.left-panel{
width:40%;
background:white;
padding:20px;
border:1px solid #ddd;
}

.right-panel{
width:60%;
background:white;
padding:20px;
border:1px solid #ddd;
}

.preview-wrapper{
position:relative;
width:100%;
border:1px solid #ddd;
overflow:hidden;
}

#previewCanvas{
width:100%;
display:block;
}

.crop-box{
position:absolute;
border:2px solid #00ff88;
display:none;
cursor:move;
}

.handle{
width:12px;
height:12px;
background:#00ff88;
position:absolute;
}

.handle-nw{top:-6px;left:-6px;}
.handle-ne{top:-6px;right:-6px;}
.handle-sw{bottom:-6px;left:-6px;}
.handle-se{bottom:-6px;right:-6px;}

.slider{
width:100%;
}

button{
padding:10px 16px;
background:black;
color:white;
border:none;
cursor:pointer;
margin-top:10px;
}

</style>
</head>


<body>

<div class="header">
<h2>PixProMax</h2>
</div>


<div class="container">

<h1>Compress Image</h1>

<div class="tool-container">

<!-- LEFT PANEL -->

<div class="left-panel">

<h3>Upload</h3>

<input type="file" id="fileInput" accept="image/*">


<h3>Crop</h3>

<label>
<input type="checkbox" id="cropToggle">
Enable Crop
</label>


<h3>Compression</h3>

<input
type="range"
min="10"
max="100"
value="80"
id="compressSlider"
class="slider">

<p>Quality: <span id="compressValue">80%</span></p>


<button id="applyChanges">Apply Changes</button>

</div>


<!-- RIGHT PANEL -->

<div class="right-panel">

<div class="preview-wrapper">

<canvas id="previewCanvas"></canvas>

<div id="cropBox" class="crop-box">

<div class="handle handle-nw"></div>
<div class="handle handle-ne"></div>
<div class="handle handle-sw"></div>
<div class="handle handle-se"></div>

</div>

</div>

</div>

</div>

</div>

<script src="/js/script.js"></script>

</body>
</html>
