<!DOCTYPE html>

<html>

<head>

<title>PNG to WebP Converter | PixProMax</title>

<meta name="description" content="Convert PNG images to WebP online free using PixProMax.">

<link rel="stylesheet" href="../css/styles.css">

</head>

<body>

<h1>PNG to WebP Converter</h1>

<p>Upload a PNG image to convert it into WebP format.</p>

<input type="file" id="fileInput">

<br><br>

<button id="convertBtn">Convert to WebP</button>

<script type="module">

import { processImage } from "../js/converter.js"
import { downloadFile } from "../js/utils.js"

document.getElementById("convertBtn").onclick = async () => {

const file = document.getElementById("fileInput").files[0]

if(!file){
alert("Please upload a PNG image")
return
}

const blob = await processImage(file,{
mode:"convert",
format:"image/webp"
})

downloadFile(blob,"converted-image.webp")

}

</script>

</body>

</html>
